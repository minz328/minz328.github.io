{% include base_path %}
{% assign author = site.author %}

<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ author.avatar | prepend: '/images/' | prepend: base_path }}" alt="{{ author.name }}">
  </div>

  <div class="author__content">
    <h3 class="author__name">{{ author.name }}</h3>
  </div>

  <div class="author__urls-wrapper">
    <button class="btn btn--inverse" type="button">Follow</button>
    <ul class="author__urls social-icons">
      <li class="author__role">{{ author.role }}</li>
      <li class="author__role">{{ author.department }}</li>
      <li class="author__role">{{ author.institution }}</li>
      <li><hr></li>
      <li><a href="mailto:{{ author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> {{ author.email }}</a></li>
      <li><a href="https://www.linkedin.com/in/{{ author.linkedin }}"><i class="fab fa-fw fa-linkedin-in" aria-hidden="true"></i> LinkedIn</a></li>
      <li><a href="{{ author.googlescholar }}"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>
    </ul>
  </div>

  <hr>

  <div class="author__visitor-map">
    <script id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?cl=080808&w=250&t=tt&d=gT4IDt5TXAhxbmso7bJXksL_-BNOD59UpQpazMBxmkc&co=ffffff&ct=808080&cmo=3acc3a&cmn=ff5353"></script>
  </div>

  <div class="author__updated">🕐 Last updated: Jan. 2026</div>
</div>
