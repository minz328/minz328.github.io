{% assign author = site.author %}

<section class="author-profile" itemscope itemtype="https://schema.org/Person">
  <meta itemprop="name" content="{{ author.name }}">
  <img class="author__avatar" src="{{ '/images/' | append: author.avatar | relative_url }}" alt="{{ author.name }}">

  <div class="author__identity">
    <p class="author__role">
      <span class="author__position" itemprop="jobTitle">{{ author.role }}</span>
      <span class="author__affiliation">{{ author.department }}</span>
      <span class="author__affiliation">{{ author.institution }}</span>
    </p>
  </div>

  <ul class="author__links">
    <li>
      <a href="mailto:{{ author.email }}">
        <svg class="author__link-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#60707b" aria-hidden="true" focusable="false">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="m4 7 8 6 8-6"></path>
        </svg>
        <span>{{ author.email }}</span>
      </a>
    </li>
    <li>
      <a href="https://www.linkedin.com/in/{{ author.linkedin }}">
        <svg class="author__link-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#60707b" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M8 10v7M8 7.5v.01M12 17v-4.2a2.8 2.8 0 0 1 5.6 0V17"></path>
        </svg>
        <span>LinkedIn</span>
      </a>
    </li>
    <li>
      <a href="{{ author.googlescholar }}">
        <svg class="author__link-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#60707b" aria-hidden="true" focusable="false">
          <path d="M2.5 9 12 4.5 21.5 9 12 13.5 2.5 9Z"></path>
          <path d="M6 11v4.2c2.8 2.2 9.2 2.2 12 0V11M21.5 9v5"></path>
        </svg>
        <span>Google Scholar</span>
      </a>
    </li>
  </ul>

  <div class="author__visitor-map">
    <script id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?cl=080808&w=250&t=tt&d=gT4IDt5TXAhxbmso7bJXksL_-BNOD59UpQpazMBxmkc&co=ffffff&ct=808080&cmo=3acc3a&cmn=ff5353"></script>
  </div>
</section>
